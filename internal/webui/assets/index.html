<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta id="theme-color" name="theme-color" content="#000000">
  <title>TeslaBox 管理中心</title>
  <link rel="stylesheet" href="/app.css?v=20260716-7">
  <script src="/app.js?v=20260716-7" defer></script>
</head>
<body>
  <main id="login-view" class="login-shell" hidden>
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">TESLABOX</p>
      <h1 id="login-title">连接你的行车记录</h1>
      <p class="muted">管理页面仅在本地网络中工作。请输入设备管理密码继续。</p>
      <form id="login-form" class="login-form">
        <label for="password">管理密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit" class="primary">登录</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
    </section>
  </main>

  <main id="app-view" hidden>
    <header class="topbar">
      <a class="brand" href="/" aria-label="TeslaBox 首页">
        <span class="brand-mark">T</span>
        <span><strong>TeslaBox</strong><small>车载存储中心</small></span>
      </a>
      <div class="top-actions">
        <span id="live-indicator" class="live-indicator"><i></i><span>正在连接</span></span>
        <label class="theme-control"><span>强调色</span><select id="theme-select" aria-label="页面强调色"><option value="blue">电光蓝</option><option value="green">松石绿</option><option value="red">赛车红</option></select></label>
        <button id="logout-button" class="ghost compact" type="button">退出</button>
      </div>
    </header>

    <div class="page">
      <section class="hero">
        <div>
          <p class="eyebrow">TESLACAM LIBRARY</p>
          <h1>每一段旅程，<br>一条完整时间轴。</h1>
          <p class="hero-copy">每分钟文件自动衔接成完整录像段。六路画面同窗合成、一套播放控制，也可随时切换单视角。</p>
        </div>
        <button id="refresh-button" class="secondary" type="button">立即刷新</button>
      </section>

      <section class="status-grid" aria-label="设备状态">
        <article class="status-card status-card-wide">
          <div class="status-card-head"><span>USB 连接</span><span id="usb-badge" class="badge">检查中</span></div>
          <strong id="usb-title">正在读取 Gadget 状态</strong>
          <p id="usb-detail" class="muted">—</p>
        </article>
        <article class="status-card">
          <span>可用录像</span>
          <strong id="video-count">—</strong>
          <p class="muted">个单路视频文件</p>
        </article>
        <article class="status-card">
          <span>数据盘空间</span>
          <strong id="space-value">—</strong>
          <div class="progress" aria-hidden="true"><i id="space-progress"></i></div>
          <p id="space-detail" class="muted">—</p>
        </article>
        <article class="status-card">
          <span>媒体快照</span>
          <strong id="snapshot-state">—</strong>
          <p id="snapshot-detail" class="muted">—</p>
        </article>
      </section>

      <section class="library" aria-labelledby="library-title">
        <div class="section-heading">
          <div><p class="eyebrow">MEDIA</p><h2 id="library-title">TeslaCam 录像</h2></div>
          <div class="library-actions"><div class="view-switch" aria-label="录像时间轴方式"><button type="button" data-view="multi" class="active">多路时间轴</button><button type="button" data-view="single">单路时间轴</button></div><div class="archive-switch" aria-label="时间线归档方式"><button type="button" data-period="month" class="active">月</button><button type="button" data-period="week">周</button><button type="button" data-period="day">日</button></div><span id="result-count" class="muted">正在载入</span></div>
        </div>

        <form id="filter-form" class="filters">
          <label>录像类型
            <select id="clip-type" name="clip_type">
              <option value="">全部类型</option><option value="recent">最近录像</option>
              <option value="saved">已保存</option><option value="sentry">哨兵事件</option>
            </select>
          </label>
          <label>日期<input id="date" name="date" type="date"></label>
          <label>事件目录<input id="event" name="event" type="search" placeholder="可选，精确匹配"></label>
          <button class="primary filter-submit" type="submit">筛选录像</button>
        </form>

        <div id="notice" class="notice" role="status" aria-live="polite"></div>
        <div id="video-grid" class="video-grid"></div>
        <button id="load-more" class="secondary load-more" type="button" hidden>加载更多</button>
      </section>
    </div>
  </main>

  <section id="player-modal" class="player-modal" role="dialog" aria-modal="true" aria-labelledby="player-title" hidden>
    <div class="player-backdrop" data-close-player></div>
    <div class="player-panel">
      <div class="player-head">
        <div><p class="eyebrow">PLAYBACK</p><h2 id="player-title">录像播放</h2><p id="player-meta" class="muted"></p></div>
        <button class="icon-button" type="button" data-close-player aria-label="关闭播放器">×</button>
      </div>
      <div id="session-player-view" class="session-player-view">
        <div class="main-video-frame"><div id="composite-grid" class="composite-grid" hidden></div><video id="session-video" playsinline preload="metadata" hidden></video><span id="active-camera-label" class="active-camera-label" hidden>前视</span><p id="player-message" class="player-message" hidden></p></div>
        <div id="camera-switcher" class="camera-switcher" aria-label="摄像头视角"></div>
        <div class="unified-controls">
          <button id="play-toggle" class="primary play-toggle" type="button" aria-label="播放">▶</button>
          <span id="current-time">00:00</span>
          <div class="timeline-control"><input id="session-timeline" type="range" min="0" max="60" step="0.1" value="0" aria-label="录像时间轴"><div id="segment-markers" class="segment-markers" aria-hidden="true"></div><div id="event-marker-layer" class="event-marker-layer"></div></div>
          <span id="total-time">00:00</span>
          <button id="fullscreen-button" class="secondary compact" type="button">全屏</button>
        </div>
        <div class="player-actions"><span id="segment-status" class="muted">等待播放</span><a id="download-link" class="secondary" href="#" download>下载当前分钟</a></div>
      </div>
    </div>
  </section>
</body>
</html>
