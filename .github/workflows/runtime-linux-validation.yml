name: RC1 isolated Linux validation

# 仅候选分支测试，不接生产密钥、不构建签名包、不修改发布通道。
on:
  push:
    branches: [codex/rc1-runtime-linux-validation, codex/update-state-rollback, codex/carplay-phone-initiated-enrollment, codex/rc1-kernel-upgrade]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-validation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '1'

jobs:
  go:
    name: Linux AMD64 Go, vet and race
    env:
      TESLABOX_PROVISIONING_TEST_MODULE: ${{ github.workspace }}/experiments/carplay-native/scripts/carplay_provisioning.py
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.3'
          cache: false
      - name: Record source and toolchain
        run: |
          mkdir -p validation-logs
          git rev-parse HEAD | tee validation-logs/commit.txt
          go version | tee validation-logs/go-version.txt
          uname -a | tee validation-logs/platform.txt
      - name: Prepare isolated XFS data filesystem
        id: xfs
        # 仅格式化 runner 临时文件，不访问真实块设备或生产服务器。
        run: |
          if ! command -v mkfs.xfs >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xfsprogs
          fi
          runnerroot="$(realpath "$RUNNER_TEMP")"
          taskdir="$(mktemp -d "$runnerroot/teslabox-xfs.XXXXXX")"
          taskdir="$(realpath "$taskdir")"
          case "$taskdir" in "$runnerroot"/teslabox-xfs.*) ;; *) exit 1 ;; esac
          echo "TESLABOX_TEST_XFS_TASK_DIR=$taskdir" >> "$GITHUB_ENV"
          image="$taskdir/data.img"
          mountroot="$taskdir/mount"
          (set -o noclobber; : > "$image")
          test -f "$image" && test ! -L "$image" && test ! -b "$image"
          test "$(realpath "$image")" = "$taskdir/data.img"
          # 稀疏盘须满足产品 8 GiB 保留策略，实际只写测试夹具与文件系统元数据。
          truncate -s 16G "$image"
          mkdir -m 0700 "$mountroot"
          sudo mkfs.xfs -f -m reflink=1 "$image"
          sudo mount -o loop,nosuid,nodev "$image" "$mountroot"
          sudo chown "$(id -u):$(id -g)" "$mountroot"
          chmod 0700 "$mountroot"
          test "$(stat -f -c %T "$mountroot")" = xfs
          test "$(stat -c %d "$mountroot")" != "$(stat -c %d /)"
          echo "TESLABOX_TEST_DATA_ROOT=$mountroot" >> "$GITHUB_ENV"
          findmnt "$mountroot" | tee validation-logs/xfs-filesystem.log
      - name: All Go tests
        run: go test -count=1 -shuffle=on -json ./... 2>&1 | tee validation-logs/go-test.jsonl
      - name: Go vet
        if: ${{ !cancelled() }}
        run: go vet ./... 2>&1 | tee validation-logs/go-vet.log
      - name: All Go race tests
        if: ${{ !cancelled() && steps.xfs.outcome == 'success' }}
        run: go test -race -count=1 -shuffle=on -json ./... 2>&1 | tee validation-logs/go-race.jsonl
      - name: Unmount isolated XFS data filesystem
        if: ${{ always() }}
        run: |
          taskdir="${TESLABOX_TEST_XFS_TASK_DIR:-}"
          if test -n "$taskdir"; then
            runnerroot="$(realpath "$RUNNER_TEMP")"
            taskdir="$(realpath "$taskdir")"
            case "$taskdir" in "$runnerroot"/teslabox-xfs.*) ;; *) exit 1 ;; esac
            if mountpoint -q "$taskdir/mount"; then
              sudo umount "$taskdir/mount"
            fi
          fi
      - name: Preserve test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-amd64-go-${{ github.sha }}
          path: validation-logs/
          retention-days: 14
          if-no-files-found: error

  transactions:
    name: Linux AMD64 media and CarPlay transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.3'
          cache: false
      - name: Record source and scope
        run: |
          mkdir -p validation-logs
          git rev-parse HEAD | tee validation-logs/commit.txt
          echo 'Linux AMD64 filesystem transactions; not Debian ARM64 tools or board acceptance.' | tee validation-logs/scope.txt
      - name: Published 0.1.31 reader accepts restored state
        run: |
          export TESLABOX_ROLLBACK_EVIDENCE="$RUNNER_TEMP/rollback-state"
          baseline=c270094e6fac5d3e38c45a9e2ab76c2f6fe84e94
          git cat-file -e "$baseline^{commit}"
          go test -count=1 -run '^TestTransactionalInstallLegacyExporterFailure$' -v ./internal/updater 2>&1 | tee validation-logs/rollback-migration.log
          legacy="$RUNNER_TEMP/published-0.1.31-reader"
          git worktree add --detach "$legacy" "$baseline"
          cp scripts/rollback-legacy-reader_test.go.txt "$legacy/internal/media/rollback_legacy_reader_test.go"
          (cd "$legacy" && go test -count=1 -run '^TestRollbackRestoredStateWithPublishedReader$' -v ./internal/media) 2>&1 | tee validation-logs/published-reader.log
          printf '%s\n' "$baseline" > validation-logs/published-baseline.txt
          sha256sum "$TESLABOX_ROLLBACK_EVIDENCE"/*.json | tee validation-logs/rollback-state-digests.txt
      - name: Real Linux media A-B-A and legacy rollback
        # root 仅用于临时目录的所有权反例，不启动服务，不访问目标板。
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local CGO_ENABLED=1 go test -count=1 -json ./internal/mediabundle ./internal/carplaybundle ./internal/runtimecomponents ./internal/updater 2>&1 | tee validation-logs/transactions.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('validation-logs/transactions.jsonl').read_text().splitlines() if line.startswith('{')]
          required = ['TestMediaVersionsRollbackAndLegacyRetention', 'TestMediaFailedPreflightPreservesActive', 'TestMediaExistingVersionRejectsChangedLibraryAlias', 'TestStageArchiveRejectsOtherOwnedVersionInRootInstaller', 'TestTransactionLinuxLockAndMetadata', 'TestTransactionLinuxLockAndMetadata/other_owner', 'TestRecoverBeforeStartAfterInterruptedActivation', 'TestTransactionalInstallLegacyExporterFailure']
          required += ['TestRestoreRetriesTargetDirectorySync', 'TestCommitSyncAndStopFailureRejectsStartAfterUnlock', 'TestRecoverNonterminalCommitIsolation', 'TestRecoverRejectsInvalidCommitIsolation', 'TestCommitCleanupFailureDoesNotRollbackCommittedState']
          required += ['TestForwardBackupComesFromRealInstallAndPreservesOlderPrevious', 'TestForwardBackupSecondInstallPublishesImmediatePredecessor', 'TestForwardBackupDirectorySyncFailureNeverWritesCandidate', 'TestForwardBackupRejectsCorruptBeforeZero', 'TestForwardBackupRejectsUnsafeExistingPrevious', 'TestForwardBackupOwnerGuardRejectsForeignMetadata']
          required += ['TestForwardBackupRejectsUnsafeExistingPrevious/' + kind for kind in ('symlink', 'hardlink', 'writable', 'writable_parent', 'foreign_owner')]
          required += ['TestWaitForProgramIdentityAcceptsOnlyCompletedExecution', 'TestWaitForProgramIdentityRejectsPersistentWrongProgram', 'TestWaitForProgramIdentityUsesParentDeadline', 'TestWaitForProgramIdentityDoesNotAcceptLateSuccess', 'TestWaitForProgramIdentityDoesNotCheckExpiredContext', 'TestProgramHealthRetainsStrictIdentity', 'TestProgramHealthDoesNotRequestAfterCancellation', 'TestInstalledProgramIdentityRejectsNonRegularTarget']
          required += ['TestProgramHealthRetainsStrictIdentity/' + case for case in ('same_pid', 'old_health_pid', 'missing_health_pid', 'pid_changed', 'wrong_executable', 'canceled_final_check')]
          for name in required:
              assert any(e.get('Test') == name and e.get('Action') == 'pass' for e in events), f'{name} did not execute and pass'
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - name: Codec diagnostics preserve runtime across restart
        if: ${{ !cancelled() }}
        run: go test -tags integration -count=1 -run '^TestCodecDiagnosticPreservesVersionIntegrityAcrossRestart$' -v ./internal/carplaybundle 2>&1 | tee validation-logs/codec-integrity.log
      - name: Isolated systemd start permission and process identity
        if: ${{ !cancelled() }}
        # 只创建唯一命名的临时 sleep 测试服务，绝不启动 teslabox.service。
        run: |
          sudo env PATH="$PATH" GOTOOLCHAIN=local CGO_ENABLED=1 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted TESLABOX_TEST_SYSTEMD=1 go test -count=5 -json -run '^TestUpdaterRealSystemdStartConsumesSinglePermission$' ./internal/updater 2>&1 | tee validation-logs/update-systemd.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('validation-logs/update-systemd.log').read_text().splitlines() if line.startswith('{')]
          name = 'TestUpdaterRealSystemdStartConsumesSinglePermission'
          assert sum(e.get('Test') == name and e.get('Action') == 'run' for e in events) == 5, 'Real simple startup did not execute five times'
          assert sum(e.get('Test') == name and e.get('Action') == 'pass' for e in events) == 5, 'Real simple startup did not pass five times'
          assert not any(e.get('Test') == name and e.get('Action') in ('fail', 'skip') for e in events), 'Real simple startup failed or skipped'
          PY
      - name: CarPlay fcntl activation and recovery
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s internal/carplaybundle -p 'test_runtime_*.py' -v 2>&1 | tee validation-logs/carplay-transactions.log
      - name: CarPlay paired-helper baseline reproduces false rollback
        if: ${{ !cancelled() }}
        env:
          TESLABOX_CARPLAY_OTA_TEST_ROOT: ${{ github.workspace }}
        # 仅运行隔离根中的真实文件事务；失败必须来自旧恢复器误删，不能由编译错误代替。
        run: |
          baseline=9a413d776f1547761d16dde2ebdf3c0d120093f9
          git cat-file -e "$baseline^{commit}"
          git diff --exit-code "$baseline" HEAD -- internal/carplaybundle/runtime_recovery.py internal/carplaybundle/runtime_install.py
          legacy="$(mktemp -d "$RUNNER_TEMP/teslabox-carplay-forward.XXXXXX")"
          git worktree add --detach "$legacy" "$baseline"
          cp internal/updater/forward_backup_integration_linux_test.go "$legacy/internal/updater/forward_backup_integration_linux_test.go"
          set +e
          (cd "$legacy" && go test -tags integration -count=1 -json -run '^TestForwardGoInstallRetainsCarPlayThroughOldRecoveryAndNewActivation$' ./internal/updater) 2>&1 | tee validation-logs/carplay-forward-baseline.jsonl
          red_status=$?
          set -e
          test "$red_status" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('validation-logs/carplay-forward-baseline.jsonl').read_text().splitlines() if line.startswith('{')]
          name = 'TestForwardGoInstallRetainsCarPlayThroughOldRecoveryAndNewActivation'
          assert any(e.get('Test') == name and e.get('Action') == 'run' for e in events), 'Baseline reproduction did not run'
          assert any(e.get('Test') == name and e.get('Action') == 'fail' for e in events), 'Baseline did not reproduce the missing forward backup'
          output = ''.join(e.get('Output', '') for e in events)
          assert '旧恢复器误删或改写本机组件：unit' in output, 'Baseline failed for a different reason'
          assert 'build failed' not in output and 'undefined:' not in output, 'Compilation failure is not a reproduction'
          PY
      - name: CarPlay paired-helper forward and rollback integration
        if: ${{ !cancelled() }}
        env:
          TESLABOX_CARPLAY_OTA_TEST_ROOT: ${{ github.workspace }}
        # 必须逐项实际通过；合成字节仅作隔离事务夹具，不代表实机 OTA、蓝牙或视频验收。
        run: |
          go test -tags integration -count=1 -json -run '^TestForwardGo' ./internal/updater 2>&1 | tee validation-logs/carplay-forward-integration.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('validation-logs/carplay-forward-integration.jsonl').read_text().splitlines() if line.startswith('{')]
          required = ['TestForwardGoInstallRetainsCarPlayThroughOldRecoveryAndNewActivation', 'TestForwardGoFailureRestoresMainStateAndActualCarPlayConfiguration', 'TestForwardGoPreparedPowerLossNeverRemovesOldComponent', 'TestForwardGoPublishedBeforeCandidatePowerLossKeepsOldComponent']
          for name in required:
              assert any(e.get('Test') == name and e.get('Action') == 'pass' for e in events), f'{name} did not execute and pass'
          assert not any(e.get('Action') == 'skip' for e in events), 'Forward integration cannot be skipped'
          PY
      - name: CarPlay enrollment budget without skipped tests
        if: ${{ !cancelled() }}
        # 确认阶段预算回归实际执行，不能因平台跳过或发现不到测试而显示成功。
        run: |
          python3 - <<'PY' 2>&1 | tee validation-logs/carplay-enrollment-budget.log
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('experiments/carplay-native/scripts', pattern='test_carplay_provisioning_budget.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun < 10:
              sys.exit('Enrollment budget tests failed, skipped, or were not fully discovered')
          PY
      - name: Installer shell regression
        if: ${{ !cancelled() }}
        run: |
          bash -n deploy/install.sh
          sh -n deploy/scripts/install-teslabox-update.sh
          python3 scripts/test-update-bootstrap.py -v 2>&1 | tee validation-logs/update-bootstrap.log
          bash scripts/test-install-apt-snapshot.sh 2>&1 | tee validation-logs/installer-shell.log
      - name: Mandatory kernel upgrade isolated failure paths
        if: ${{ !cancelled() }}
        # 全部命令为测试替身；不执行真实内核安装或重启，不访问测试板。
        run: |
          python3 scripts/test-kernel-upgrade.py -v 2>&1 | tee validation-logs/kernel-upgrade.log
          python3 scripts/test-kernel-bootstrap.py -v 2>&1 | tee validation-logs/kernel-bootstrap.log
      - name: Preserve transaction evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-amd64-transactions-${{ github.sha }}
          path: validation-logs/
          retention-days: 14
          if-no-files-found: error

  frontend:
    name: Node frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - name: Record source and Node
        run: |
          mkdir -p validation-logs
          git rev-parse HEAD | tee validation-logs/commit.txt
          node --version | tee validation-logs/node-version.txt
      - name: All frontend tests
        run: node --test --test-reporter=tap internal/webui/*test.cjs 2>&1 | tee validation-logs/node-tests.log
      - name: Preserve frontend evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: validation-logs/
          retention-days: 14
          if-no-files-found: error
